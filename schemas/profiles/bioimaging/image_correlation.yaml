id: https://w3id.org/mim/schemas/domain_specific_profiles/bioimaging/image_correlation
name: mim_bioimaging_image_correlation
title: MIM image correlation
description: >-
  Process linking spatially or temporally correlated image datasets.
version: 1.0.0
license: https://creativecommons.org/licenses/by/4.0/

prefixes:
  linkml: https://w3id.org/linkml/
  mim: https://w3id.org/mim/
  orcid: https://orcid.org/

imports:
  - linkml:types
  - ../../foundation/process
  - ../../foundation/ontology_term
  - image_data

default_prefix: mim
default_range: string

created_by: orcid:0000-0002-4904-3269

annotations:
  created_by_name: Tooba Abbassi-Daloii
  created_by_affiliation: Amsterdam UMC; ACDC
  schema_status: draft
  semantic_basis: MIHCSME and REMBI-informed MIM profile
  module_name: image_correlation
  profile: bioimaging

classes:
  MIMImageCorrelation:
    is_a: MIMProcess
    extra_slots:
      allowed: true
    attributes:
      input_images:
        range: MIMImageData
        slot_uri: mim:ImageCorrelation_input_images
        multivalued: true
      relationship_type:
        range: MIMOntologyTerm
        slot_uri: mim:ImageCorrelation_relationship_type
      alignment_description:
        range: string
        slot_uri: mim:ImageCorrelation_alignment_description
      fiducials:
        range: MIMOntologyTerm
        slot_uri: mim:ImageCorrelation_fiducials
        multivalued: true
      transformation_matrix:
        range: string
        slot_uri: mim:ImageCorrelation_transformation_matrix
