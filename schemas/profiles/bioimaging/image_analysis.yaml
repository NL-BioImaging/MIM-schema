id: https://w3id.org/mim/schemas/domain_specific_profiles/bioimaging/image_analysis
name: mim_bioimaging_image_analysis
title: MIM image analysis
description: >-
  Image-analysis process extending the MIM process model.
version: 1.0.0
license: https://creativecommons.org/licenses/by/4.0/

prefixes:
  linkml: https://w3id.org/linkml/
  mim: https://w3id.org/mim/
  orcid: https://orcid.org/

imports:
  - linkml:types
  - ../../foundation/process
  - ../../foundation/software_component
  - image_data

default_prefix: mim
default_range: string

created_by: orcid:0000-0002-4904-3269

annotations:
  created_by_name: Tooba Abbassi-Daloii
  created_by_affiliation: Amsterdam UMC; ACDC
  schema_status: draft
  semantic_basis: MIHCSME and REMBI-informed MIM profile
  module_name: image_analysis
  profile: bioimaging

classes:
  MIMImageAnalysis:
    is_a: MIMProcess
    extra_slots:
      allowed: true
    attributes:
      software:
        range: MIMSoftwareComponent
        slot_uri: mim:ImageAnalysis_software
        multivalued: true
      input_images:
        range: MIMImageData
        slot_uri: mim:ImageAnalysis_input_images
        multivalued: true
      output_images:
        range: MIMImageData
        slot_uri: mim:ImageAnalysis_output_images
        multivalued: true
